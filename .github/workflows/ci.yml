# .github/workflows/ci.yml
#
# CI — запускается на любой push и pull_request в main
# Отвечает за: качество кода, типизацию, тесты, сборку образа
#
# CD находится в: .github/workflows/cd.yml

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: pdfnik-bot

jobs:

  # ─────────────────────────────────────────────
  #  LINT — ruff + mypy
  # ─────────────────────────────────────────────
  lint:
    name: "Lint & Type check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install dependencies
        run: uv sync --dev

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy main_app/ --strict --ignore-missing-imports

  # ─────────────────────────────────────────────
  #  SECURITY — bandit + trivy
  # ─────────────────────────────────────────────
  security:
    name: "Security scan"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: bandit
        run: uv run bandit -r main_app/ --severity-level=medium --confidence-level=medium -x tests/

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: trivy (CVE year-based scan)
        run: bash scripts/trivy_check.sh fs .

  # ─────────────────────────────────────────────
  #  TEST — pytest с сервисами
  # ─────────────────────────────────────────────
  test:
    name: "Tests"
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install dependencies
        run: uv sync --dev

      - name: pytest
        run: uv run pytest tests/ -v --cov=main_app --cov-report=xml --cov-report=term-missing
        env:
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/ # pragma: allowlist secret
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────
  #  BUILD — сборка Docker образа
  #  Запускается только если lint + security + test прошли
  # ─────────────────────────────────────────────
  build:
    name: "Build Docker image"
    runs-on: ubuntu-latest
    needs: [lint, security, test]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Save image artifact
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: image.tar.gz
          retention-days: 1
