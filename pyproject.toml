[project]
name = "pdfnik-telegram-bot"
version = "0.1.0"
description = "Telegram bot frontend for PDFnik ecosystem"
requires-python = ">=3.13"

dependencies = [
    "aiogram==3.23.0",
    "faststream[rabbit]==0.6.3",
    "faststream[redis]==0.6.3",
    "pydantic==2.11.10",
    "pydantic-settings==2.11.0",
    "pdfnik-schemes @ git+https://github.com/Evil2997/PDFnik-Schemes@v1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "coverage>=7.6.0",
    "ruff>=0.4.10",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main_app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "coverage>=7.6.0",
    "ruff>=0.4.10",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "detect-secrets>=1.5.0",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".git", ".venv", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501", # line too long — контролируется formatter
    "B008", # function calls in default args (aiogram DI)
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["main_app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
# Не strict: aiogram и faststream не имеют полных stubs.
# Включаем полезные проверки без блокировки на отсутствующих типах.
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Модули с тяжёлыми внешними зависимостями — исключаем из проверки типов.
# Когда появятся stubs — убрать из exclude.
exclude = [
    "main_app/infrastructure/bot_factory\\.py",
    "main_app/infrastructure/rabbit_connector\\.py",
    "main_app/infrastructure/redis_connector\\.py",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:aiogram",
    "ignore::DeprecationWarning:faststream",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["main_app"]
omit = ["main_app/core/*", "tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 65
